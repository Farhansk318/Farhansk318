<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HomeTech Spares</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div id="message" class="message"></div>

        <div id="login-view" class="view">
            <h2>Login</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
                <a href="#" id="forgot-password-link">Forgot Password?</a>
            </form>
        </div>

        <div id="forgot-password-view" class="view" style="display:none;">
            <h2>Forgot Password</h2>
            <form id="forgot-password-form">
                <p>Enter your email to receive an OTP.</p>
                <input type="email" id="forgot-email" placeholder="Email" required>
                <button type="submit">Send OTP</button>
                <a href="#" class="back-link">&larr; Back to Login</a>
            </form>
        </div>

        <div id="verify-otp-view" class="view" style="display:none;">
            <h2>Verify OTP</h2>
            <form id="verify-otp-form">
                <p>An OTP has been sent to your email.</p>
                <input type="text" id="otp" placeholder="Enter 6-digit OTP" required maxlength="6">
                <button type="submit">Verify OTP</button>
                <a href="#" class="back-link">&larr; Back to Login</a>
            </form>
        </div>
        
        <div id="reset-password-view" class="view" style="display:none;">
            <h2>Reset Password</h2>
            <form id="reset-password-form">
                <p>Enter your new password.</p>
                <input type="password" id="new-password" placeholder="New Password" required>
                <button type="submit">Reset Password</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
